name: Automated Contribution Log

on:
  schedule:
    # Runs automatically every day at 12:00 PM UTC (5:30 PM IST)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to manually click a button to test it anytime

jobs:
  commit-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Log current timestamp
        run: |
          echo "Automated check-in: $(date)" >> daily_log.txt

      - name: Push log to GitHub profile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_log.txt
          git commit -m "chore: automated background project sync [skip ci]"
          git push
